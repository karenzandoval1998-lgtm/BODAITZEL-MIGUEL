
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: transparent;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.marco {
  width: 100%;
  max-width: 620px;
  opacity: 0;
  transform: translateY(25px) scale(.92);
  filter: blur(4px);
  animation: aparecer 2s ease-out forwards;
}

.marco img {
  display: block;
  width: 100%;
  height: auto;
  animation: brillo 5s ease-in-out 2s infinite;
}

@keyframes aparecer {
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes brillo {
  0%, 100% {
    filter: drop-shadow(0 0 0 rgba(190,164,105,0));
  }
  50% {
    filter: drop-shadow(0 0 9px rgba(190,164,105,.3));
  }
}

@media (prefers-reduced-motion: reduce) {
  .marco {
    animation: none;
    opacity: 1;
    transform: none;
    filter: none;
  }
  .marco img { animation: none; }
}
</style>
</head>
<body>
<div class="marco">
  <img
    src="marco-itzel-miguel.png"
    alt="Itzel y Miguel"
  >
</div>
</body>
</html>
